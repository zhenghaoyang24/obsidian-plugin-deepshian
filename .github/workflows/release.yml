name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # Auto-release when a pure numeric version tag is pushed, e.g. 1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.4). Must match an existing tag."
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tag push -> the tag itself; manual dispatch -> the default branch.
          # Building the triggering ref (not "main") keeps the release artifacts
          # and their build provenance attributable to the exact released code.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in sync with @types/node in package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get the version from the tag name (tags carry no "v" prefix)
            VERSION="${GITHUB_REF_NAME}"
          else
            # Manual trigger: use the input version
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

      - name: Check if release exists
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --json tagName &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Skip if already released
        if: steps.check.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.version }} already exists, skipped"

      - name: Build plugin
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Attest build provenance
        if: steps.check.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/main.js
            build/styles.css
            build/manifest.json

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            build/main.js
            build/styles.css
            build/manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
